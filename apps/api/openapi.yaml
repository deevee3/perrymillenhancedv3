openapi: 3.0.3
info:
  title: Perry Mill
  version: 1.0.0
servers:
  - url: /v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceKey:
      type: apiKey
      in: header
      name: x-service-key
  schemas:
    Feed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        title:
          type: string
          nullable: true
        site_url:
          type: string
          nullable: true
        last_fetched_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - active
            - error
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
          nullable: true
        guid:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        link:
          type: string
        canonical_url:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        text:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
        language:
          type: string
          nullable: true
        word_count:
          type: integer
          nullable: true
        status:
          type: string
          enum:
            - new
            - queued
            - processed
            - failed
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginatedArticles:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /articles:
    get:
      summary: List articles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: feedId
          schema:
            type: string
            format: uuid
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticles'
  /articles/{id}:
    get:
      summary: Get article by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Article
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Not found
  /articles/{id}/save:
    post:
      summary: Save article
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Saved
    delete:
      summary: Unsave article
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed
  /articles/{id}/share:
    post:
      summary: Create share link
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Share token
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
  /s/{token}:
    get:
      summary: Public share page
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Not found
  /feeds:
    get:
      summary: List feeds
      security:
        - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feed'
    post:
      summary: Add feed
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feed'
  /ingest/rss:
    post:
      summary: Ingest RSS item (internal)
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - feed_url
                - title
                - link
              properties:
                feed_url:
                  type: string
                guid:
                  type: string
                title:
                  type: string
                summary:
                  type: string
                link:
                  type: string
                published_at:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Accepted
  /ingest/fulltext:
    post:
      summary: Enqueue full-text crawl (internal)
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - article_id
                - link
              properties:
                article_id:
                  type: string
                  format: uuid
                link:
                  type: string
      responses:
        '202':
          description: Enqueued
